name: AstroDB Phase 1 checks
on:
  push:
    branches:
      - fix/astrodb-natalcore-timezone-20261016
  workflow_dispatch:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check astrodb/drive-sync.js
          node --check astrodb/chart-recovery.js
      - name: AstroDB tests
        run: node --test astrodb/tests/*.test.cjs
