<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QS33DS · Llengua i ortografia</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#263449;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{display:flex;align-items:center;gap:18px;padding:13px 20px;background:white;border-bottom:1px solid #dce3eb;flex-wrap:wrap}h1{font-size:19px;margin:0}a{color:#225b91;text-decoration:none}nav{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px;background:#eaf0f6}button{border:1px solid #cbd7e4;border-radius:10px;padding:10px 14px;background:white;color:#2b405a;font-weight:600;cursor:pointer}button.active{background:#244f7a;color:white;border-color:#244f7a}main{padding:12px}iframe{display:block;width:100%;height:calc(100dvh - 142px);min-height:560px;border:1px solid #dce3eb;border-radius:12px;background:white}@media(max-width:700px){iframe{height:calc(100dvh - 195px)}}</style></head>
<body><header><a href="index.html">← Biblioteca</a><h1>Llengua i ortografia</h1><span style="margin-left:auto;font-size:12px;color:#687789">QS33DS V17 · Mòduls originals</span></header><nav aria-label="Activitats"><button type="button" data-file="02_Targetes_Ortografiques_V3.html">Targetes ortogràfiques</button><button type="button" data-file="06_Generador_Fitxes_Vocabulari_V8_A5_Equilibrat.html">Fitxes de vocabulari</button><button type="button" data-file="09_Generador_Frases_Escriptura_V1.html">Frases i escriptura</button><button type="button" data-file="16_Generador_Puntuacio_Frase_V1.html">Puntuació</button><button type="button" data-file="08_Generador_Consciencia_Fonologica_V1.html">Consciència fonològica</button></nav><main><iframe id="activitat" title="Activitat" loading="eager"></iframe></main>
<script>const frame=document.getElementById('activitat');const buttons=[...document.querySelectorAll('nav button')];function openModule(b){buttons.forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});frame.src='modulos/'+encodeURIComponent(b.dataset.file);location.hash=encodeURIComponent(b.dataset.file)}buttons.forEach(b=>b.addEventListener('click',()=>openModule(b)));openModule(buttons.find(b=>b.dataset.file===decodeURIComponent(location.hash.slice(1)))||buttons[0]);</script></body></html>
