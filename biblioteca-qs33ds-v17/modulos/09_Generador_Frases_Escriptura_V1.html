<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador de Frases i Escriptura · QS33DS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f8;color:#24394b;font:16px system-ui,Arial,sans-serif}header{background:#e1edf7;padding:16px 24px}h1{margin:0;font-size:1.6rem}header p{margin:4px 0}main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:15px;padding:16px;max-width:1450px;margin:auto}.controls,.preview{background:white;border-radius:15px;padding:17px;border:1px solid #d9e4ed}.controls{align-self:start}label{display:block;font-weight:650;margin:12px 0 5px}select,input,textarea{width:100%;border:1px solid #b9cad8;border-radius:8px;padding:9px;font:inherit}textarea{min-height:90px}button{background:#286b9c;border:0;border-radius:9px;color:white;padding:11px 15px;font-weight:700;cursor:pointer;margin:12px 6px 0 0}.note{color:#536b7d;font-size:13px;line-height:1.5}.preview{overflow:auto}.stage{width:100%;overflow:hidden}.sheet{width:210mm;min-height:297mm;padding:12mm;background:#fff;color:#17212a;transform-origin:top left;font-family:Arial,sans-serif}.sheet.a5spread{width:297mm;min-height:210mm;padding:0;display:flex}.half{width:148.5mm;min-height:210mm;padding:11mm 10mm 10mm 13mm;position:relative}.half+.half{border-left:1px dashed #aaa;padding:11mm 13mm 10mm 10mm}.heading{display:flex;justify-content:space-between;border-bottom:1px solid #777;padding-bottom:5mm;margin-bottom:5mm;font-size:12px}.sheet h2{font-size:19px;margin:0 0 6mm}.instruction{font-size:13px;margin-bottom:5mm}.tasks{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:3mm}.task{break-inside:avoid;background:#f4f7f9;border-radius:3mm;padding:3mm;min-height:24mm}.itemline{display:flex;align-items:center;gap:2mm}.pic{font-size:30px;min-width:35px;text-align:center}.word{font-size:17px;font-weight:650}.choices{display:flex;gap:4mm;flex-wrap:wrap;margin-top:2mm;font-size:15px}.writing{position:relative;height:18mm;margin-top:2mm}.writing:before,.writing:after{content:"";position:absolute;left:0;right:0;border-top:1px solid #59616b}.writing:before{top:6mm}.writing:after{top:14mm}.dots{display:flex;gap:2mm;margin-top:3mm}.dot{width:8mm;height:8mm;border:1px solid #555;border-radius:50%}.boxline{border-bottom:1px solid #666;min-height:12mm}.cut{border:1px dashed #888;border-radius:2mm;padding:3mm}.font-pal .word,.font-pal .choices{text-transform:uppercase}.font-lligada .word,.font-lligada .choices{font-family:"Segoe Print","Comic Sans MS",cursive}.font-accessible .word,.font-accessible .choices{font-family:"Atkinson Hyperlegible",Verdana,Arial,sans-serif}@media(max-width:800px){main{display:block}.controls{margin-bottom:12px}}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}header,.controls{display:none}.preview{padding:0;border:0;overflow:visible}main{display:block;padding:0;margin:0}.stage{overflow:visible}.sheet{transform:none!important;box-shadow:none}.sheet.a5spread{page-break-after:always}@page landscape{size:A4 landscape;margin:0}body:has(.a5spread) .sheet{page:landscape}}
</style></head><body><header><h1>Generador de Frases i Escriptura</h1><p>QS33DS · Materials físics per a primària</p></header><main><aside class="controls">
<label>Activitat<select id="mode"><option value="order">Ordena les paraules</option><option value="copy">Llegeix i copia</option><option value="complete">Completa la frase</option><option value="cut">Retalla i construeix frases</option></select></label><label>Camp de vocabulari<select id="category"></select></label>
<label>Exercicis totals<select id="count"><option>6</option><option selected>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></label>
<label>Columnes<select id="cols"><option>1</option><option selected>2</option><option>3</option></select></label>
<label>Tipus de lletra<select id="font"><option value="accessible">Lectura accessible</option><option value="pal">Lletra de pal</option><option value="impremta">Lletra d'impremta</option><option value="lligada">Lletra lligada (segons dispositiu)</option></select></label>
<label>Format<select id="format"><option value="a4">A4 vertical</option><option value="a5">Dues pàgines A5 en un A4 horitzontal</option></select></label>
<label>Títol de la fitxa<input id="title" value="Generador de Frases i Escriptura"></label>
<button id="generate">Barreja les activitats</button><button id="print">Imprimeix / Desa PDF</button>
<p class="note">Sense solucionari. Per a l'A5 doble, imprimeix en A4 horitzontal a escala 100%, sense capçaleres ni peus del navegador. Els símbols visuals poden variar segons el dispositiu.</p></aside>
<section class="preview"><div class="stage" id="stage"><div id="sheets"></div></div></section></main><script>const DATA={"Accions quotidianes": [["La nena menja una poma.", "👧 🍎"], ["El nen llegeix un llibre.", "👦 📖"], ["La mare prepara el dinar.", "👩 🍽️"], ["El pare renta el cotxe.", "👨 🚗"], ["La nena juga amb la pilota.", "👧 ⚽"], ["El gat dorm al sofà.", "🐈 🛋️"], ["El gos corre pel parc.", "🐕 🌳"], ["La família va a escola.", "👨‍👩‍👧 🎒"]], "Animals i natura": [["El conill menja una pastanaga.", "🐇 🥕"], ["La papallona vola entre les flors.", "🦋 🌼"], ["El peix neda al riu.", "🐟 🏞️"], ["La vaca menja herba.", "🐄 🌱"], ["El sol escalfa la terra.", "☀️ 🌍"], ["La pluja mulla els arbres.", "🌧️ 🌳"], ["La tortuga camina lentament.", "🐢"], ["El lleó descansa sota un arbre.", "🦁 🌳"]], "Escola i aprenentatge": [["L’alumna escriu amb un llapis.", "✏️ 📒"], ["El mestre explica un conte.", "📖"], ["La classe escolta una cançó.", "🎵"], ["Els infants pinten un dibuix.", "🎨"], ["La nena guarda la motxilla.", "🎒"], ["El nen retalla un paper.", "✂️ 📄"], ["Llegim un llibre a la biblioteca.", "📚"], ["Fem una fila al passadís.", "🚶"]], "Transport i ciutat": [["El tren arriba a l’estació.", "🚆"], ["El cotxe para al semàfor.", "🚗 🚦"], ["La bicicleta va pel carril bici.", "🚲"], ["L’autobús porta els passatgers.", "🚌"], ["L’avió vola per damunt dels núvols.", "✈️ ☁️"], ["El vaixell navega pel mar.", "🚢"], ["El camió transporta caixes.", "🚚 📦"], ["La moto gira a la dreta.", "🏍️"]], "Emocions i convivència": [["La nena està contenta.", "😊"], ["El nen demana ajuda.", "🙋"], ["Els amics comparteixen una joguina.", "🧸"], ["La família celebra una festa.", "🎉"], ["El nen està sorprès.", "😮"], ["La nena respira amb calma.", "😌"], ["Els companys treballen junts.", "🤝"], ["Tothom espera el seu torn.", "⏳"]]};
const instructions={"order": "Ordena les paraules i escriu la frase.", "copy": "Llegeix la frase i copia-la a la pauta.", "complete": "Escriu la paraula que falta a la frase.", "cut": "Retalla les targetes i construeix la frase. Després copia-la."};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&amp;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function heading(){return '<div class="heading"><span>Nom: __________________</span><span>Data: __________</span></div><h2>'+esc($('title').value)+'</h2>'}
function makePage(items,format){let html=heading()+'<p class="instruction">'+esc(instructions[$('mode').value])+'</p><div class="tasks" style="--cols:'+$('cols').value+'">'+items.map(renderTask).join('')+'</div>';return html}
function render(){const n=Number($('count').value),format=$('format').value;let all=shuffle(DATA[$('category').value]);let selected=Array.from({length:n},(_,i)=>all[i%all.length]);const el=$('sheets');el.innerHTML='';for(let start=0;start<selected.length;start+=(format==='a5'?n:24)){let items=selected.slice(start,start+(format==='a5'?n:24));let sheet=document.createElement('div');sheet.className='sheet font-'+$('font').value+(format==='a5'?' a5spread':'');if(format==='a5'){let mid=Math.floor(items.length/2);sheet.innerHTML='<div class="half">'+makePage(items.slice(0,mid))+'</div><div class="half">'+makePage(items.slice(mid))+'</div>'}else sheet.innerHTML=makePage(items);el.append(sheet)}scale()}
function scale(){let stage=$('stage'),sheets=$('sheets');sheets.style.transform='';sheets.style.width='';let width=sheets.firstElementChild?.getBoundingClientRect().width||794;let ratio=Math.min(1,(stage.clientWidth-3)/width);sheets.style.transformOrigin='top left';sheets.style.transform='scale('+ratio+')';sheets.style.width=width+'px';stage.style.height=Math.ceil(sheets.scrollHeight*ratio)+'px'}
function setup(){Object.keys(DATA).forEach(k=>$('category').add(new Option(k,k)));['mode','category','count','cols','font','format','title'].forEach(id=>$(id).addEventListener('change',render));$('title').addEventListener('input',render);$('generate').onclick=render;$('print').onclick=()=>window.print();window.addEventListener('resize',scale);render()}

function renderTask(it){let [sentence,pic]=it,m=$('mode').value,words=sentence.replace(/[.!?]/g,'').split(/\s+/);let content='';
if(m==='order')content='<div class="choices">'+shuffle(words).map(w=>'<span class="cut">'+esc(w)+'</span>').join('')+'</div><div class="writing"></div>';
else if(m==='copy')content='<div class="word">'+esc(sentence)+'</div><div class="writing"></div>';
else if(m==='complete'){let ix=Math.floor(words.length/2);words[ix]='________';content='<div class="word">'+esc(words.join(' '))+'.</div><div class="writing"></div>'}
else content='<div class="choices">'+shuffle(words).map(w=>'<span class="cut">'+esc(w)+'</span>').join('')+'</div><div class="writing"></div>';
return '<div class="task"><div class="itemline"><span class="pic">'+pic+'</span></div>'+content+'</div>'}
setup();
</script></body></html>
