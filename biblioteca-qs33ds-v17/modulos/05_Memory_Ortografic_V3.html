<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory · Vocabulari i grafies</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#254353;background:#f5fafb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(100deg,#e6f5f2,#edf1ff);padding:24px max(20px,calc((100% - 1120px)/2));border-bottom:1px solid #dbe8e9}h1{margin:0 0 6px;font-size:1.65rem}header p{margin:0;color:#536c77}main{max-width:1120px;margin:auto;padding:22px 18px}section,.panel{background:white;border:1px solid #dce8ed;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #203f4a08}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px}label{display:grid;gap:5px;font-weight:650;font-size:.88rem}select,input,button{font:inherit;border-radius:10px;padding:10px 13px;border:1px solid #cbdce0;background:white;color:#234352}button{cursor:pointer;background:#e4f4f1;border-color:#baded7;font-weight:650}button.primary{background:#266f76;color:white;border-color:#266f76}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82c7dd}button:hover:not(:disabled){filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#f6f9ff;border:2px solid #e2eaf5;border-radius:14px;padding:15px;text-align:center;min-height:105px;display:grid;place-items:center}.emoji{font-size:3.6rem}.word{font-size:2rem;font-weight:750;letter-spacing:.04em}.muted{color:#607783}.success{color:#127258}.error{color:#a23c3c}.hidden{display:none!important}.hint{font-size:.86rem;color:#607783}.big{font-size:2.5rem}.status{min-height:24px;font-weight:650}.chip{display:inline-block;background:#e8f4f3;border-radius:99px;padding:5px 10px;margin:3px;font-size:.85rem}.printonly{display:none}@media print{header,.noprint,.controls,button,.status{display:none!important}body{background:white;color:black}main{padding:0;max-width:none}.panel,section{box-shadow:none;border:0;padding:0}.printonly{display:block}.page{break-after:page;page-break-after:always;padding:10mm}.page:last-child{break-after:auto}.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}.cell{border:2px solid #222;min-height:34mm;display:flex;align-items:center;justify-content:center;font-size:21pt;font-weight:bold;text-align:center}.cardtitle{text-align:center;margin-bottom:10mm}}@media(max-width:500px){.word{font-size:1.5rem}.controls>*{width:100%}}main{max-width:1500px}.grid{gap:18px}#board .tile{min-height:190px!important;border-width:3px;padding:20px}#board .emoji{font-size:5rem}#board .big{font-size:5rem}#board .word{overflow-wrap:anywhere}select,button{font-size:1.15rem;min-height:52px}@media(max-width:650px){#board{grid-template-columns:repeat(2,minmax(0,1fr))!important}#board .tile{min-height:150px!important}} </style></head><body><header><h1>Memory · Vocabulari i grafies</h1><p>QS33DS · Recursos educatius · Català · Funciona sense connexió</p></header><main><section class="controls noprint"><label>Categoria<select id="cat"></select></label><label>Tipus de parelles<select id="mode"><option value="imatge">Imatge ↔ paraula</option><option value="grafia">Paraula ↔ grafia sola (TX ↔ cotxe)</option><option value="destacada">Paraula ↔ grafia destacada</option><option value="paraula">Paraula ↔ paraula (memòria visual)</option></select></label><label>Parelles<select id="num"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></label><button class="primary" onclick="start()">Nova partida</button></section><section><div class="controls" style="justify-content:space-between"><b id="status">Troba les parelles</b><span id="tries" class="muted"></span></div><div id="board" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(175px,1fr));margin-top:20px"></div></section><section><p class="muted">Les parelles es poden trobar sense límit de temps. La grafia destacada serveix per fixar l'atenció en l'ortografia.</p></section></main><script>const DATA={"B / V": ["vaixell", "vaca", "avió", "bosc", "biblioteca", "núvol", "cavall", "sabata", "abella", "vent", "botiga", "volar"], "G / J": ["girafa", "gelat", "jardí", "joguina", "germà", "gegant", "jaqueta", "juliol", "gent", "gira-sol", "jove", "pàgina"], "G / GU": ["guitarra", "guerra", "guineu", "gallina", "gota", "formiga", "aigua", "guant", "goma", "gust", "guanyar", "amiga"], "C / QU": ["casa", "cotxe", "cuina", "quatre", "quinze", "escola", "paquet", "mosquit", "cullera", "raqueta", "coca", "equip"], "Ç / C / S": ["plaça", "braç", "dolç", "cinc", "sopa", "sabata", "caça", "feliç", "peça", "cel", "cirera", "cistella"], "X / IX / TX": ["caixa", "peix", "xocolata", "cotxe", "dutxa", "bruixa", "maduixa", "xarxa", "panxa", "fitxa", "xemeneia", "despatx"], "LL / L·L": ["lluna", "llapis", "llibre", "papallona", "col·legi", "il·lusió", "galleda", "pollastre", "llimona", "pel·lícula", "llac", "llengua"], "NY": ["pinya", "muntanya", "canya", "aranya", "banyera", "castanya", "company", "senyal", "any", "cunyat", "pany", "llenya"], "R / RR": ["carro", "pera", "terra", "ratolí", "rosa", "arròs", "carrer", "barret", "mar", "sorra", "torre", "pare"], "M / N": ["camp", "tambor", "ombra", "compra", "enviar", "invent", "canvi", "embut", "important", "manta", "bombolla", "convidar"], "Accents": ["música", "camió", "cafè", "màquina", "pàgina", "també", "però", "matí", "telèfon", "arròs", "àvia", "dilluns"], "Diàresi": ["raïm", "veïna", "pingüí", "qüestió", "paraigües", "aigües", "raïmet", "lingüista"], "H": ["home", "hora", "hospital", "història", "herba", "hivern", "habitació", "ahir", "hort", "helicòpter"], "Apòstrof": ["l arbre", "l escola", "l avi", "d aigua", "l illa", "l elefant"], "Animals": ["gat", "gos", "vaca", "cavall", "conill", "gallina", "peix", "abella", "girafa", "elefant", "lleó", "ratolí"], "Aliments": ["poma", "pera", "plàtan", "maduixa", "pa", "formatge", "llet", "pastanaga", "tomàquet", "raïm", "cirera", "síndria"], "Escola": ["llapis", "llibre", "taula", "cadira", "motxilla", "goma", "tisores", "pissarra", "retolador", "carpeta", "paper", "regle"], "Cos": ["mà", "peu", "braç", "cama", "cap", "nas", "boca", "ull", "orella", "dit", "genoll", "esquena"], "Casa": ["porta", "finestra", "llit", "cuina", "sofà", "taula", "cadira", "mirall", "dutxa", "armari", "llum", "rellotge"], "Natura": ["arbre", "flor", "muntanya", "riu", "mar", "sol", "lluna", "núvol", "pluja", "vent", "pedra", "fulla"]},IMG={"gat": "🐈", "gos": "🐕", "vaca": "🐄", "cavall": "🐎", "conill": "🐇", "gallina": "🐔", "peix": "🐟", "abella": "🐝", "girafa": "🦒", "elefant": "🐘", "lleó": "🦁", "ratolí": "🐁", "poma": "🍎", "pera": "🍐", "plàtan": "🍌", "maduixa": "🍓", "pa": "🍞", "formatge": "🧀", "llet": "🥛", "pastanaga": "🥕", "tomàquet": "🍅", "raïm": "🍇", "cirera": "🍒", "síndria": "🍉", "llapis": "✏️", "llibre": "📘", "taula": "🪑", "cadira": "🪑", "motxilla": "🎒", "goma": "🧽", "tisores": "✂️", "pissarra": "🟩", "paper": "📄", "regle": "📏", "mà": "✋", "peu": "🦶", "braç": "💪", "cama": "🦵", "cap": "🙂", "nas": "👃", "boca": "👄", "ull": "👁️", "orella": "👂", "dit": "☝️", "genoll": "🦵", "porta": "🚪", "finestra": "🪟", "llit": "🛏️", "cuina": "🍳", "sofà": "🛋️", "mirall": "🪞", "dutxa": "🚿", "armari": "🚪", "llum": "💡", "rellotge": "🕒", "arbre": "🌳", "flor": "🌼", "muntanya": "⛰️", "riu": "🏞️", "mar": "🌊", "sol": "☀️", "lluna": "🌙", "núvol": "☁️", "pluja": "🌧️", "vent": "💨", "pedra": "🪨", "fulla": "🍃", "vaixell": "🚢", "avió": "✈️", "biblioteca": "📚", "sabata": "👟", "botiga": "🏪", "gelat": "🍦", "jardí": "🌷", "joguina": "🧸", "jaqueta": "🧥", "guitarra": "🎸", "guineu": "🦊", "aigua": "💧", "guant": "🧤", "casa": "🏠", "cotxe": "🚗", "escola": "🏫", "paquet": "📦", "mosquit": "🦟", "cullera": "🥄", "raqueta": "🏸", "plaça": "🏙️", "sopa": "🥣", "caixa": "📦", "xocolata": "🍫", "bruixa": "🧙", "panxa": "🤰", "llimona": "🍋", "pinya": "🍍", "aranya": "🕷️", "banyera": "🛁", "castanya": "🌰", "carro": "🛒", "rosa": "🌹", "arròs": "🍚", "barret": "🎩", "camp": "🌾", "tambor": "🥁", "música": "🎵", "camió": "🚚", "cafè": "☕", "màquina": "⚙️", "telèfon": "☎️", "àvia": "👵", "home": "👨", "hospital": "🏥", "herba": "🌿", "hivern": "❄️", "helicòpter": "🚁"};function rand(a){return [...a].sort(()=>Math.random()-.5)}function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ca-ES';u.rate=.82;speechSynthesis.speak(u)}}function good(){try{let a=new (window.AudioContext||window.webkitAudioContext)();[660,880,1100].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);let t=a.currentTime+i*.1;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.start(t);o.stop(t+.11)})}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(el,arr){el.innerHTML=arr.map(x=>'<option>'+esc(x)+'</option>').join('')}function norm(s){return s.trim().normalize('NFC').toLocaleLowerCase('ca')}let cards=[],first=null,locked=false,found=0,attempts=0;options(cat,Object.keys(DATA));function pattern(w){let c=cat.value,re={'B / V':/[bv]/i,'G / J':/[gj]/i,'G / GU':/gu|g/i,'C / QU':/qu|c/i,'Ç / C / S':/[çcs]/i,'X / IX / TX':/tx|ix|x/i,'LL / L·L':/l·l|ll/i,'NY':/ny/i,'R / RR':/rr|r/i,'M / N':/[mn]/i,'Accents':/[àèéíòóú]/i,'Diàresi':/[ïü]/i,'H':/h/i}[c]||/[aeiouàèéíòóú]/i;return esc(w).replace(re,m=>'<span style="color:#b63865;text-decoration:underline">'+m+'</span>')}function grapheme(w){let re={'B / V':/[bv]/i,'G / J':/gu|g|j/i,'G / GU':/gu|g/i,'C / QU':/qu|c/i,'Ç / C / S':/[çcs]/i,'X / IX / TX':/tx|ix|x/i,'LL / L·L':/l·l|ll/i,'NY':/ny/i,'R / RR':/rr|r/i,'M / N':/[mn]/i,'Accents':/[àèéíòóú]/i,'Diàresi':/[ïü]/i,'H':/h/i}[cat.value]||/[aeiouàèéíòóú]/i;return (w.match(re)||[w.slice(0,1)])[0].toUpperCase()}function start(){let words=DATA[cat.value];if(mode.value==='imatge')words=words.filter(w=>IMG[w]);if(words.length<2){status.textContent='Tria una categoria amb imatges';board.innerHTML='';return}if(mode.value==='grafia'){const used=new Set();words=rand(words).filter(w=>{const g=grapheme(w);if(used.has(g))return false;used.add(g);return true});if(words.length<2){status.textContent='Aquesta categoria no té prou grafies diferents. Tria una altra categoria o modalitat.';board.innerHTML='';return}}let chosen=rand(words).slice(0,Math.min(+num.value,words.length));cards=rand(chosen.flatMap((w,i)=>[{id:i,w,side:0,open:false,done:false},{id:i,w,side:1,open:false,done:false}]));first=null;locked=false;found=0;attempts=0;render()}function content(c){if(c.side===0)return '<div class="word" style="font-size:clamp(1.4rem,2.5vw,2.6rem)">'+esc(c.w)+'</div>';if(mode.value==='imatge')return '<div class="emoji">'+(IMG[c.w]||'❓')+'</div>';if(mode.value==='grafia')return '<div class="word" style="font-size:clamp(2.2rem,4vw,4rem)">'+esc(grapheme(c.w))+'</div>';if(mode.value==='destacada')return '<div class="word" style="font-size:clamp(1.5rem,3vw,2.6rem)">'+pattern(c.w)+'</div>';return '<div class="word" style="font-size:1.1rem;letter-spacing:.13em">'+esc(c.w.toUpperCase())+'</div>'}function render(){tries.textContent='Intents: '+attempts+' · Parelles: '+found+'/'+(cards.length/2);board.innerHTML=cards.map((c,i)=>'<button class="tile" style="min-height:190px;'+(c.done?'background:#e1f5eb;border-color:#9ed5b9;':'')+'" '+(c.done?'disabled':'')+' onclick="flip('+i+')" aria-label="Targeta '+(i+1)+'">'+(c.open||c.done?content(c):'<span class="big">?</span>')+'</button>').join('')}function flip(i){let c=cards[i];if(locked||c.open||c.done)return;c.open=true;render();if(first===null){first=i;return}let a=cards[first];attempts++;if(a.id===c.id){a.done=c.done=true;found++;first=null;good();status.textContent=found===cards.length/2?'Felicitats! Has trobat totes les parelles!':'Parella trobada!';render()}else{locked=true;status.textContent='Torna-ho a provar';let x=first;first=null;setTimeout(()=>{cards[x].open=false;cards[i].open=false;locked=false;render()},900)}}mode.addEventListener('change',start);cat.addEventListener('change',start);start();</script></body></html>
