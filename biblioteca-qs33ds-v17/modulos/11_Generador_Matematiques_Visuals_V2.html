<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generador de Matemàtiques Visuals V2 · QS33DS</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4f9;color:#263d50;font:15px system-ui,Arial}header{background:linear-gradient(100deg,#d9eafa,#e6f6ef);padding:17px 25px;border-bottom:1px solid #c7dbe7}h1{margin:0;font-size:25px}header p{margin:4px 0;color:#547184}main{display:grid;grid-template-columns:295px minmax(0,1fr);gap:16px;padding:16px;max-width:1450px;margin:auto}aside,.preview{background:white;border:1px solid #d6e4ec;border-radius:17px;padding:17px}aside{align-self:start}label{display:block;margin:12px 0 5px;font-weight:700;font-size:13px}select,input{width:100%;padding:9px;border:1px solid #b6cbd8;border-radius:9px;background:white;font:inherit}button{border:0;border-radius:10px;background:#246fa5;color:white;font-weight:700;padding:11px 13px;cursor:pointer;margin:13px 5px 0 0}button.alt{background:#387f70}.hint{font-size:12px;line-height:1.5;color:#5e7282}.preview{overflow:auto}.stage{overflow:hidden;width:100%}.sheets{transform-origin:top left}.sheet{width:210mm;height:297mm;padding:11mm;background:white;overflow:hidden;color:#263747;font-family:Arial,sans-serif}.sheet.spread{width:297mm;height:210mm;padding:0;display:flex}.half{width:148.5mm;height:210mm;padding:9mm 9mm 9mm 12mm;overflow:hidden}.half+.half{border-left:1px dashed #b8bec5;padding-left:10mm;padding-right:11mm}.topline{display:flex;justify-content:space-between;border-bottom:1px solid #a9bdc9;padding-bottom:3mm;font-size:12px}.pagehead{display:flex;align-items:center;gap:3mm;margin:4mm 0}.mascot{background:#dbf2e9;border-radius:50%;font-size:22px;width:13mm;height:13mm;display:grid;place-items:center}.pagehead h2{margin:0;font-size:19px;color:#256f87}.instruction{font-size:12px;color:#557185;margin:0 0 4mm}.tasks{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:3mm;align-content:start}.task{border:1px solid #dce8f0;border-radius:4mm;background:#f7fafc;padding:3mm;break-inside:avoid;min-height:32mm;overflow:hidden}.task:nth-child(3n+1){background:#f0f8fc}.task:nth-child(3n+2){background:#f3f9f2}.task:nth-child(3n){background:#fff9ee}.tasktitle{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#688092;margin-bottom:2mm;font-weight:700}.operation{font-size:23px;font-weight:800;text-align:center;letter-spacing:1px;margin:4mm 0}.answer{border-bottom:2px solid #8ea4b2;display:inline-block;min-width:18mm}.vertical{margin:1mm auto 2mm;width:max-content;min-width:30mm;text-align:right;font:700 26px/1.2 'Courier New',monospace}.vertical .sumline{border-bottom:2px solid #324d60;padding-bottom:1mm}.vertical .sumline::before{content:'+';float:left;margin-right:6mm;color:#287ba7}.vertical .result{height:12mm}.note{font-size:11px;color:#688092;margin:2mm 0}.numberline{width:100%;height:auto;display:block;margin-top:1mm}.rock{width:100%;height:auto;display:block;max-height:42mm}.boxes{display:flex;justify-content:space-between;gap:2mm}.smallbox{border:1px solid #9db9c9;background:#fff;border-radius:2mm;min-height:12mm;flex:1;padding:2mm;font-size:11px;text-align:center}.blankline{height:11mm;border-bottom:1px solid #9db4c1}.sheet.spread .task{min-height:27mm}.sheet.spread .operation{font-size:19px;margin:2mm 0}.sheet.spread .vertical{font-size:21px}.sheet.spread .rock{max-height:32mm}.sheet.spread .mascot{width:10mm;height:10mm;font-size:17px}.sheet.spread .pagehead h2{font-size:16px}@media(max-width:800px){main{display:block}aside{margin-bottom:12px}}@media print{@page{size:A4 portrait;margin:0}body:has(.spread){--page:landscape}body{background:#fff}header,aside{display:none}main{display:block;padding:0;margin:0}.preview{border:0;padding:0;overflow:visible}.stage{overflow:visible!important;height:auto!important}.sheets{transform:none!important;width:auto!important}.sheet{break-after:page;page-break-after:always}.sheet.spread{page:landscape}@page landscape{size:A4 landscape;margin:0}}

/* A5 doble: cada meitat és una pàgina A5 completa, sense segones capçaleres. */
.sheet.spread .half{display:flex;flex-direction:column;min-width:0}
.sheet.spread .tasks{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);align-content:stretch;gap:2.5mm}
.sheet.spread .task{min-height:0;display:flex;flex-direction:column;justify-content:center;padding:2.5mm}
.sheet.spread .topline{flex-shrink:0}
.sheet.spread .pagehead{flex-shrink:0;margin:3mm 0}
.sheet.spread .instruction{flex-shrink:0;margin-bottom:3mm}
.sheet.spread .tasktitle{font-size:9px}
.sheet.spread .boxes{gap:1.5mm}
.sheet.spread .smallbox{min-height:10mm;padding:1.5mm}
.sheet.spread .operation{font-size:18px}
.sheet.spread .blankline{height:7mm}
.sheet.spread .rock{max-height:30mm}
@media print{.sheet.spread .half{height:210mm}}
</style></head><body><header><h1>🧮 Matemàtiques Visuals · V2</h1><p>QS33DS · Fitxes de càlcul amb estratègies diverses</p></header><main><aside><label>Estratègia de càlcul<select id="mode"><option value="horizontal">Sumes horitzontals</option><option value="vertical">Sumes verticals</option><option value="jumps">Salts a la línia numèrica</option><option value="decomp">Suma per descomposició</option><option value="rock">Rocòdrom · puja fins al resultat</option><option value="mix">Barreja d'estratègies</option></select></label><label>Rang numèric<select id="range"><option value="10">Fins a 10</option><option value="20" selected>Fins a 20</option><option value="100">Fins a 100</option><option value="1000">Fins a 1.000</option></select></label><label>Dificultat<select id="difficulty"><option value="easy">Sense pas de desena</option><option value="carry" selected>Amb pas de desena</option><option value="all">Mixt</option></select></label><label>Exercicis<select id="count"><option>4</option><option selected>6</option><option>8</option><option>12</option><option>16</option><option>20</option></select></label><label>Columnes<select id="cols"><option>1</option><option selected>2</option><option>3</option></select></label><label>Format de paper<select id="format"><option value="a4">A4 vertical</option><option value="a5">A5 doble en A4 horitzontal</option></select></label><label>Títol<input id="title" value="Aventura de càlcul"></label><button id="new">Genera fitxa nova</button><button class="alt" id="print">Imprimeix / Desa PDF</button><p class="hint">Els salts permeten dibuixar la ruta pròpia. El rocòdrom proposa una escalada numèrica amb punts de suport i passos per completar. No és una reproducció oficial d'Innovamat ni d'OAOA.</p></aside><section class="preview"><div class="stage" id="stage"><div class="sheets" id="sheets"></div></div></section></main><script>
const $=id=>document.getElementById(id),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let problems=[];const modes=['horizontal','vertical','jumps','decomp','rock'];
const titles={horizontal:'Suma i descobreix',vertical:'Suma en columna',jumps:'Fes salts per sumar',decomp:'Descompon i suma',rock:'Escala el rocòdrom'};
const ins={horizontal:'Calcula les sumes. Pots fer dibuixos si et cal.',vertical:'Col·loca bé les xifres i calcula.',jumps:'Comença al primer nombre i dibuixa els salts.',decomp:'Separa desenes i unitats abans de sumar.',rock:'Puja des del primer nombre fins a la meta. Escriu els salts.'};
function makeProblem(i){let max=+$('range').value,d=$('difficulty').value,a,b,tries=0;do{a=rnd(max<=20?1:Math.floor(max*.12),Math.max(2,Math.floor(max*.7)));b=rnd(1,Math.max(2,Math.min(max-a,Math.floor(max*.4))));tries++;let crosses=(a%10+b%10)>=10;if(d==='easy'&&!crosses||d==='carry'&&crosses||d==='all')break}while(tries<400);let mode=$('mode').value==='mix'?modes[i%modes.length]:$('mode').value;return {a,b,mode}}
function svgJumps(a,b){let labels=[a,'','','',a+b];return `<svg class="numberline" viewBox="0 0 290 115" xmlns="http://www.w3.org/2000/svg" aria-label="Línia numèrica per completar"><path d="M18 87 H272" stroke="#496b80" stroke-width="2"/><path d="M272 87 l-8 -4 v8 z" fill="#496b80"/><path d="M28 81 V93 M262 81 V93" stroke="#496b80" stroke-width="2"/><circle cx="28" cy="87" r="5" fill="#5ab4a6"/><circle cx="262" cy="87" r="5" fill="#f4b45d"/><text x="28" y="106" text-anchor="middle" font-size="15" font-weight="bold">${a}</text><text x="262" y="106" text-anchor="middle" font-size="14">?</text><path d="M28 81 Q82 6 135 81 M135 81 Q198 6 262 81" fill="none" stroke="#64a9d3" stroke-width="2.5" stroke-dasharray="5 4"/><text x="82" y="26" text-anchor="middle" font-size="14">+ ___</text><text x="200" y="26" text-anchor="middle" font-size="14">+ ___</text><text x="145" y="102" text-anchor="middle" font-size="12" fill="#536b7d">${a} + ${b} = ____</text></svg>`}
function svgRock(a,b){let y=[125,98,72,46,20],x=[35,92,155,216,260];let circles=x.map((v,i)=>`<circle cx="${v}" cy="${y[i]}" r="17" fill="${i===0?'#caeee2':i===4?'#ffe0a6':'#e4ecfa'}" stroke="#85a8bb" stroke-width="1.5"/><text x="${v}" y="${y[i]+5}" font-size="13" font-weight="bold" text-anchor="middle">${i===0?a:i===4?'?':'___'}</text>`).join('');let paths=x.slice(0,-1).map((v,i)=>`<path d="M${v+15} ${y[i]-7} L${x[i+1]-15} ${y[i+1]+7}" stroke="#4d92b5" stroke-width="2.5" stroke-dasharray="4 3"/><text x="${(v+x[i+1])/2}" y="${(y[i]+y[i+1])/2-8}" font-size="12" text-anchor="middle">+__</text>`).join('');return `<svg class="rock" viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg" aria-label="Rocòdrom de suma"><path d="M10 145 Q15 20 80 8 Q160 30 195 4 Q278 3 291 40 L295 149 Z" fill="#e8f0e6" stroke="#b6c9bb"/>${paths}${circles}<text x="250" y="150" text-anchor="middle" font-size="11">META: ${a}+${b}</text></svg>`}
function task(p,i){let {a,b,mode}=p,body='';if(mode==='horizontal')body=`<div class="operation">${a} + ${b} = <span class="answer">&nbsp;</span></div><div class="blankline"></div>`;if(mode==='vertical')body=`<div class="vertical"><div>${a}</div><div class="sumline">${b}</div><div class="result"></div></div>`;if(mode==='jumps')body=svgJumps(a,b);if(mode==='decomp'){let base=a>=100?100:10;body=`<div class="operation">${a} + ${b}</div><div class="boxes"><div class="smallbox">${a} =<br>_____ + _____</div><div class="smallbox">${b} =<br>_____ + _____</div></div><div class="blankline"></div>`}if(mode==='rock')body=svgRock(a,b);return `<div class="task"><div class="tasktitle">${i+1} · ${titles[mode]}</div>${body}</div>`}
function header(){let m=$('mode').value;return `<div class="topline"><span>Nom: ___________________</span><span>Data: ___________</span></div><div class="pagehead"><span class="mascot">⭐</span><h2>${escapeHtml($('title').value)}</h2></div><p class="instruction">${m==='mix'?'Tria una estratègia per a cada operació.':ins[m]}</p>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(items,start){return header()+`<div class="tasks" style="--cols:${$('cols').value}">`+items.map((p,i)=>task(p,start+i)).join('')+'</div>'}
function render(){let format=$('format').value,n=problems.length,cap=format==='a5'?($('mode').value==='rock'?8:16):($('mode').value==='rock'?8:16);$('sheets').innerHTML='';for(let k=0;k<n;k+=cap){let batch=problems.slice(k,k+cap),s=document.createElement('div');s.className='sheet'+(format==='a5'?' spread':'');if(format==='a5'){let mid=Math.ceil(batch.length/2);s.innerHTML='<div class="half">'+page(batch.slice(0,mid),k)+'</div><div class="half">'+page(batch.slice(mid),k+mid)+'</div>'}else s.innerHTML=page(batch,k);$('sheets').appendChild(s)}scale()}
function scale(){let stage=$('stage'),sheets=$('sheets');sheets.style.transform='none';sheets.style.width='';let sheet=sheets.firstElementChild;if(!sheet)return;let w=sheet.getBoundingClientRect().width,ratio=Math.min(1,(stage.clientWidth-5)/w);sheets.style.width=w+'px';sheets.style.transform=`scale(${ratio})`;stage.style.height=Math.ceil(sheets.scrollHeight*ratio)+'px'}
function generate(){problems=Array.from({length:+$('count').value},(_,i)=>makeProblem(i));render()}
['mode','range','difficulty','count','cols','format'].forEach(id=>$(id).addEventListener('change',generate));$('title').addEventListener('input',render);$('new').onclick=generate;$('print').onclick=()=>{let st=document.getElementById('printPage');if(!st){st=document.createElement('style');st.id='printPage';document.head.appendChild(st)}st.textContent=$('format').value==='a5'?'@media print{@page{size:A4 landscape;margin:0}}':'@media print{@page{size:A4 portrait;margin:0}}';window.print()};window.addEventListener('resize',scale);generate();
</script></body></html>
