0}.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2mm}.step{border-top:1px solid #d5e1e6;padding-top:1.5mm;font-size:10px;color:#526f7d}.step b{color:#30586c}.line{border-bottom:1px solid #b3c8d2;height:7mm}.draw{height:13mm;border:1px dashed #c2d2d9;border-radius:2mm}.response{border-bottom:1px solid #7799a9;height:9mm;font-size:10px}.play{max-width:740px;margin:auto}.question{border:1px solid #d1e1e9;background:#f7fafb;border-radius:12px;padding:18px}.question p{font-size:19px;line-height:1.5}.play input{max-width:220px}.feedback{min-height:28px;font-weight:650;margin:10px 0}.hint{color:#486f83;font-size:13px}.note{font-size:12px;color:#607885;line-height:1.5}@media(max-width:800px){main{display:block}aside{margin-bottom:12px}}@media print{@page{size:A4 portrait;margin:0}@page wide{size:A4 landscape;margin:0}header,aside,.tabs,.play{display:none!important}body,main,.work,.preview{display:block;margin:0;padding:0;border:0;background:white;overflow:visible!important}.stack{transform:none!important;width:auto!important}.paper{break-after:page}.paper.spread{page:wide}}
/* Enunciats amb màxima llegibilitat, sense etiquetes didàctiques impreses. */
:root{--statement-size:16px}
.statement{font-size:var(--statement-size);line-height:1.62;font-weight:550;color:#152c38;letter-spacing:.012em;overflow-wrap:break-word}
.task{justify-content:flex-start;gap:3mm}
.task .steps{margin-top:auto}
.tag{font-size:11px;color:#547486;font-weight:700}
body[data-font="accessible"] .paper{font-family:Arial,Verdana,sans-serif}
body[data-font="print"] .paper{font-family:Verdana,Arial,sans-serif}
body[data-font="school"] .paper{font-family:"Trebuchet MS",Verdana,sans-serif}
body[data-font="serif"] .paper{font-family:Georgia,"Times New Roman",serif}
body[data-font="caps"] .statement{text-transform:uppercase;letter-spacing:.035em}
@media print{.tag{color:#333}.statement{color:#111}}

/* V1.2: espai d’escriptura real en targetes rectangulars */
.task{justify-content:flex-start;gap:2.5mm;background:#fff!important;padding:3.5mm;border-radius:2.5mm;min-height:0}
.tag{font-size:11px;font-weight:750;color:#335d70;flex:0 0 auto}
.statement{font-weight:650;line-height:1.5;flex:0 0 auto;margin-bottom:1mm}
.workspace{display:grid;flex:1;min-height:0;gap:2mm;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1.25fr) minmax(12mm,.55fr)}
.workarea,.answerarea{position:relative;border:1px solid #b6cbd5;border-radius:1.8mm;min-width:0;min-height:0;padding:6mm 2mm 2mm;background:white}
.worklabel{position:absolute;top:1.2mm;left:2mm;font-size:9.5px;font-weight:700;color:#456d7e}
.guided-work .workarea:first-child{grid-column:1;grid-row:1}
.guided-work .workarea:nth-child(2){grid-column:2;grid-row:1}
.guided-work .calcarea{grid-column:1/-1;grid-row:2}
.guided-work .answerarea{grid-column:1/-1;grid-row:3}
.workspace:has(.workarea:nth-child(2):last-of-type){grid-template-rows:minmax(0,1fr) minmax(0,1.4fr) minmax(12mm,.55fr)}
.free-work{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(15mm,.22fr)}
.free-work .workarea{grid-column:1;grid-row:1}
.free-work .answerarea{grid-column:1;grid-row:2}
/* Amb dues targetes per A4, cada problema té un espai útil considerable. */
.paper .tasks{grid-auto-rows:minmax(0,1fr)}
.paper.spread .half .tasks{grid-template-columns:1fr!important}
.paper.spread .task{padding:2.5mm;gap:2mm}
.paper.spread .statement{line-height:1.4}
.paper.spread .workspace{gap:1.5mm}
.paper.spread .worklabel{font-size:8.5px}
@media print{.task{background:white!important}.workarea,.answerarea{border-color:#9baeb7}.tag{color:#333}}

/* V1.3: quatre problemes per una sola cara A4; repartiment compacte sense perdre la pauta de treball */
.paper.compact .tasks{grid-template-columns:1fr!important;grid-template-rows:repeat(4,minmax(0,1fr));gap:2mm}
.paper.compact .task{padding:2mm 2.5mm;gap:1mm;min-height:0}
.paper.compact .tag{font-size:9px}
.paper.compact .statement{line-height:1.3;margin:0;font-size:min(var(--statement-size,14px),15px)}
.paper.compact .workspace{gap:1.3mm;grid-template-rows:minmax(0,1fr) minmax(0,1.1fr) minmax(8mm,.5fr)}
.paper.compact .workarea,.paper.compact .answerarea{padding:4mm 1.5mm 1mm}
.paper.compact .worklabel{font-size:8px;top:.7mm;left:1.5mm}
.paper.compact .free-work{grid-template-rows:minmax(0,1fr) minmax(9mm,.35fr)}
.paper.compact .head{font-size:10px}
.paper.compact .sheettitle{margin:2mm 0;font-size:15px}
@media print{.paper:last-child{break-after:auto}.paper{break-inside:avoid}}
