<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Puntuació i frases · QS33DS</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f8;color:#21384b;font:15px system-ui,Arial}header{background:#dceef2;padding:16px 24px}h1{margin:0;font-size:24px}header p{margin:4px 0}main{display:grid;grid-template-columns:290px minmax(0,1fr);gap:15px;padding:15px;max-width:1500px;margin:auto}aside,.preview{background:white;border:1px solid #d9e6ed;border-radius:14px;padding:15px}aside{align-self:start}label{display:block;font-weight:650;margin:12px 0 4px}select,input{width:100%;font:inherit;padding:9px;border:1px solid #b9cddd;border-radius:8px}button{background:#28749a;border:0;color:white;border-radius:8px;padding:11px 14px;margin:12px 5px 0 0;font-weight:bold;cursor:pointer}.note{font-size:12px;color:#536b79;line-height:1.5}.preview{overflow:hidden}.stage{overflow:hidden;position:relative}.stack{transform-origin:top left}.paper{background:#fff;width:210mm;height:297mm;padding:12mm;overflow:hidden;color:#1d3445}.paper.spread{width:297mm;height:210mm;padding:0;display:flex}.half{width:50%;height:210mm;padding:10mm 10mm 10mm 12mm;overflow:hidden;display:flex;flex-direction:column}.half+ .half{border-left:1px dashed #c5d2d9;padding-left:12mm}.head{font-size:11px;display:flex;justify-content:space-between;border-bottom:1px solid #c0d5dd;padding-bottom:3mm}.sheet-title{font-size:18px;font-weight:750;margin:4mm 0 2mm;color:#23758c}.hint{font-size:11px;margin:0 0 4mm;color:#526c7a}.tasks{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3mm;flex:1;min-height:0}.task{min-width:0;min-height:0;overflow:hidden;border:1px solid #cfe0e8;border-radius:3mm;padding:3mm;background:#f5f9fb;display:flex;flex-direction:column;justify-content:space-around;break-inside:avoid}.task:nth-child(3n+2){background:#f3f9f3}.task:nth-child(3n){background:#fff8ee}.number{font-size:12px;color:#557484}.big{font-size:23px;font-weight:700;text-align:center}.medium{font-size:16px;font-weight:650;text-align:center}.write{border-bottom:1px solid #8ba7b8;height:11mm}.pauta{height:17mm;position:relative}.pauta:before,.pauta:after{content:'';position:absolute;left:0;right:0;border-top:1px solid #8ba7b8}.pauta:before{top:5mm}.pauta:after{top:12mm}.tiles{display:flex;gap:2mm;justify-content:center;flex-wrap:wrap}.tile{border:1px solid #8eafc0;background:white;border-radius:2mm;padding:2mm;min-width:9mm;text-align:center;font-weight:650}.clock{width:39mm;height:39mm;display:block;margin:0 auto}.money{font-size:24px;text-align:center;letter-spacing:2px}.gridshape{display:grid;grid-template-columns:repeat(4,1fr);gap:2mm;justify-items:center}.shape{font-size:25px}.small{font-size:11px;color:#536b7a;text-align:center}@media(max-width:750px){main{display:block}aside{margin-bottom:12px}}@media print{@page{size:A4 portrait;margin:0}body:has(.spread){--landscape:1}body,main,.preview,.stage{margin:0;padding:0;background:white;border:0;display:block;overflow:visible}header,aside{display:none}.stack{transform:none!important;width:auto!important}.stage{height:auto!important}.paper{break-after:page;box-shadow:none}@page wide{size:A4 landscape;margin:0}.spread{page:wide}}</style></head><body><header><h1>Puntuació i frases</h1><p>QS33DS · Fitxes imprimibles · Funciona sense connexió</p></header><main><aside><label>Tipus d'activitat<select id="mode"><option value="capitals">Majúscula i punt</option><option value="question">Signes de puntuació</option><option value="order">Ordena les paraules</option></select></label><label>Nivell o tema<select id="category"></select></label><label>Exercicis<select id="count"><option>4</option><option selected>8</option><option>12</option><option>16</option></select></label><label>Columnes<select id="cols"><option>1</option><option selected>2</option><option>3</option></select></label><label>Paper<select id="format"><option value="a4">A4 vertical</option><option value="a5">A5 doble · A4 horitzontal</option></select></label><label>Títol<input id="title" value="Puntuació i frases"></label><button id="new">Genera fitxa nova</button><button id="print">Imprimeix / Desa PDF</button><p class="note">Sense solucionari. Per a A5 doble: A4 horitzontal, escala 100% i sense capçaleres del navegador. Revisa la vista prèvia d'impressió abans d'imprimir.</p></aside><section class="preview"><div id="stage" class="stage"><div id="stack" class="stack"></div></div></section></main><script>const CATEGORIES={"CI · frases curtes": ["avui fa sol", "el gat dorm", "on és la pilota", "quin dia és avui", "m agrada llegir", "quina sorpresa"], "CM · frases": ["demà anirem al parc", "quan comença la classe", "la laia porta un llibre", "quina alegria veure t", "el tren arriba a les vuit", "on has deixat el llapis"], "CS · frases llargues": ["el dissabte visitarem el museu de ciències", "per què és important reciclar els residus", "quina excursió tan interessant hem fet", "la biblioteca obre a les quatre de la tarda", "quan arribin els companys començarem el projecte", "quin descobriment tan sorprenent"]};
const INSTRUCTIONS={"capitals": "Copia la frase amb majúscula inicial i signe final.", "question": "Llegeix i afegeix el signe final adequat: . ? !", "order": "Ordena les paraules i escriu la frase correctament."};

const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]))}
let current=[];
function makeSide(items,start){return '<div class="head"><span>Nom: ____________________</span><span>Data: __________</span></div><div class="sheet-title">'+escapeHtml($('title').value)+'</div><p class="hint">'+escapeHtml(INSTRUCTIONS[$('mode').value])+'</p><div class="tasks" style="--cols:'+$('cols').value+'">'+items.map((x,i)=>'<div class="task"><div class="number">'+(start+i+1)+'</div>'+task(x)+'</div>').join('')+'</div>'}
function render(){const n=Number($('count').value),a5=$('format').value==='a5';const pool=makePool();current=shuffle(pool).slice(0,n);while(current.length<n)current.push(pool[current.length%pool.length]);let el=$('stack');el.innerHTML='';let cap=a5?Math.min(n,16):Math.min(n,16);for(let i=0;i<n;i+=cap){let batch=current.slice(i,i+cap);let sheet=document.createElement('section');sheet.className='paper'+(a5?' spread':'');if(a5){let mid=Math.ceil(batch.length/2);sheet.innerHTML='<div class="half">'+makeSide(batch.slice(0,mid),i)+'</div><div class="half">'+makeSide(batch.slice(mid),i+mid)+'</div>'}else sheet.innerHTML=makeSide(batch,i);el.appendChild(sheet)}scale()}
function scale(){let stage=$('stage'),stack=$('stack');stack.style.transform='none';let w=stack.firstElementChild?.getBoundingClientRect().width||794;let r=Math.min(1,(stage.clientWidth-5)/w);stack.style.transform='scale('+r+')';stack.style.width=w+'px';stage.style.height=Math.ceil(stack.scrollHeight*r)+'px'}
function setup(){Object.keys(CATEGORIES).forEach(k=>$('category').add(new Option(k,k)));['mode','category','count','cols','format','title'].forEach(id=>$(id).addEventListener('change',render));$('title').addEventListener('input',render);$('new').onclick=render;$('print').onclick=()=>window.print();window.addEventListener('resize',scale);render()}
function makePool(){return CATEGORIES[$('category').value].map((sentence,i)=>({sentence,i}))}
function task(o){let m=$('mode').value,words=o.sentence.split(' ');let text=m==='order'?shuffle(words).map(x=>'<span class="tile">'+escapeHtml(x)+'</span>').join(' '):escapeHtml(o.sentence);return '<div class="'+(m==='order'?'tiles':'medium')+'">'+text+'</div>'+(m==='question'?'<div class="small">Signe final: ☐ . &nbsp; ☐ ? &nbsp; ☐ !</div>':'')+'<div class="pauta"></div>'}
setup();</script></body></html>
