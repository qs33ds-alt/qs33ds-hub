<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Targetes ortogràfiques · Aprenc i recordo</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#254353;background:#f5fafb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(100deg,#e6f5f2,#edf1ff);padding:24px max(20px,calc((100% - 1120px)/2));border-bottom:1px solid #dbe8e9}h1{margin:0 0 6px;font-size:1.65rem}header p{margin:0;color:#536c77}main{max-width:1120px;margin:auto;padding:22px 18px}section,.panel{background:white;border:1px solid #dce8ed;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 16px #203f4a08}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px}label{display:grid;gap:5px;font-weight:650;font-size:.88rem}select,input,button{font:inherit;border-radius:10px;padding:10px 13px;border:1px solid #cbdce0;background:white;color:#234352}button{cursor:pointer;background:#e4f4f1;border-color:#baded7;font-weight:650}button.primary{background:#266f76;color:white;border-color:#266f76}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #82c7dd}button:hover:not(:disabled){filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{background:#f6f9ff;border:2px solid #e2eaf5;border-radius:14px;padding:15px;text-align:center;min-height:105px;display:grid;place-items:center}.emoji{font-size:3.6rem}.word{font-size:2rem;font-weight:750;letter-spacing:.04em}.muted{color:#607783}.success{color:#127258}.error{color:#a23c3c}.hidden{display:none!important}.hint{font-size:.86rem;color:#607783}.big{font-size:2.5rem}.status{min-height:24px;font-weight:650}.chip{display:inline-block;background:#e8f4f3;border-radius:99px;padding:5px 10px;margin:3px;font-size:.85rem}.printonly{display:none}@media print{header,.noprint,.controls,button,.status{display:none!important}body{background:white;color:black}main{padding:0;max-width:none}.panel,section{box-shadow:none;border:0;padding:0}.printonly{display:block}.page{break-after:page;page-break-after:always;padding:10mm}.page:last-child{break-after:auto}.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm}.cell{border:2px solid #222;min-height:34mm;display:flex;align-items:center;justify-content:center;font-size:21pt;font-weight:bold;text-align:center}.cardtitle{text-align:center;margin-bottom:10mm}}@media(max-width:500px){.word{font-size:1.5rem}.controls>*{width:100%}}main{max-width:1480px}#exercise{min-height:410px!important;padding:45px 20px!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}#exercise .word{font-size:clamp(3.2rem,7vw,7rem)!important;line-height:1.2}#exercise .emoji{font-size:clamp(6rem,12vw,11rem)!important}#exercise .big{font-size:clamp(3rem,7vw,6rem)!important}#exercise input{font-size:clamp(1.8rem,3vw,3rem);max-width:90%;min-height:75px;text-align:center}#actions button{font-size:1.35rem;padding:16px 24px;min-height:60px}#exercise button{font-size:1.3rem;padding:15px 22px}.controls select,.controls button{font-size:1.15rem;min-height:52px}#feedback{font-size:1.35rem;text-align:center} @media(max-width:600px){#exercise{min-height:320px!important}} </style></head><body><header><h1>Targetes ortogràfiques · Aprenc i recordo</h1><p>QS33DS · Recursos educatius · Català · Funciona sense connexió</p></header><main><section class="controls noprint"><label>Vocabulari<select id="cat"></select></label><label>Modalitat<select id="mode"><option value="visual">Observo i recordo</option><option value="completa">Completo la grafia</option><option value="escric">Escric de memòria</option><option value="imatges">Imatges i paraules</option></select></label><button class="primary" onclick="start()">Començar</button><button onclick="restart()">Reiniciar</button></section><section><div class="controls" style="justify-content:space-between"><span id="progress" class="muted"></span><span id="score" class="muted"></span></div><div id="exercise" style="text-align:center;padding:25px 0"></div><div id="feedback" class="status" aria-live="polite"></div><div class="controls noprint" id="actions"></div></section><section class="noprint"><h3>Com aprenem?</h3><p class="muted">Mirem la paraula i la grafia difícil, la tapem, la recuperem de memòria i comprovem l'escriptura. Les paraules que costen tornen a sortir.</p></section></main><script>const DATA={"B / V": ["vaixell", "vaca", "avió", "bosc", "biblioteca", "núvol", "cavall", "sabata", "abella", "vent", "botiga", "volar"], "G / J": ["girafa", "gelat", "jardí", "joguina", "germà", "gegant", "jaqueta", "juliol", "gent", "gira-sol", "jove", "pàgina"], "G / GU": ["guitarra", "guerra", "guineu", "gallina", "gota", "formiga", "aigua", "guant", "goma", "gust", "guanyar", "amiga"], "C / QU": ["casa", "cotxe", "cuina", "quatre", "quinze", "escola", "paquet", "mosquit", "cullera", "raqueta", "coca", "equip"], "Ç / C / S": ["plaça", "braç", "dolç", "cinc", "sopa", "sabata", "caça", "feliç", "peça", "cel", "cirera", "cistella"], "X / IX / TX": ["caixa", "peix", "xocolata", "cotxe", "dutxa", "bruixa", "maduixa", "xarxa", "panxa", "fitxa", "xemeneia", "despatx"], "LL / L·L": ["lluna", "llapis", "llibre", "papallona", "col·legi", "il·lusió", "galleda", "pollastre", "llimona", "pel·lícula", "llac", "llengua"], "NY": ["pinya", "muntanya", "canya", "aranya", "banyera", "castanya", "company", "senyal", "any", "cunyat", "pany", "llenya"], "R / RR": ["carro", "pera", "terra", "ratolí", "rosa", "arròs", "carrer", "barret", "mar", "sorra", "torre", "pare"], "M / N": ["camp", "tambor", "ombra", "compra", "enviar", "invent", "canvi", "embut", "important", "manta", "bombolla", "convidar"], "Accents": ["música", "camió", "cafè", "màquina", "pàgina", "també", "però", "matí", "telèfon", "arròs", "àvia", "dilluns"], "Diàresi": ["raïm", "veïna", "pingüí", "qüestió", "paraigües", "aigües", "raïmet", "lingüista"], "H": ["home", "hora", "hospital", "història", "herba", "hivern", "habitació", "ahir", "hort", "helicòpter"], "Apòstrof": ["l arbre", "l escola", "l avi", "d aigua", "l illa", "l elefant"], "Animals": ["gat", "gos", "vaca", "cavall", "conill", "gallina", "peix", "abella", "girafa", "elefant", "lleó", "ratolí"], "Aliments": ["poma", "pera", "plàtan", "maduixa", "pa", "formatge", "llet", "pastanaga", "tomàquet", "raïm", "cirera", "síndria"], "Escola": ["llapis", "llibre", "taula", "cadira", "motxilla", "goma", "tisores", "pissarra", "retolador", "carpeta", "paper", "regle"], "Cos": ["mà", "peu", "braç", "cama", "cap", "nas", "boca", "ull", "orella", "dit", "genoll", "esquena"], "Casa": ["porta", "finestra", "llit", "cuina", "sofà", "taula", "cadira", "mirall", "dutxa", "armari", "llum", "rellotge"], "Natura": ["arbre", "flor", "muntanya", "riu", "mar", "sol", "lluna", "núvol", "pluja", "vent", "pedra", "fulla"]},IMG={"gat": "🐈", "gos": "🐕", "vaca": "🐄", "cavall": "🐎", "conill": "🐇", "gallina": "🐔", "peix": "🐟", "abella": "🐝", "girafa": "🦒", "elefant": "🐘", "lleó": "🦁", "ratolí": "🐁", "poma": "🍎", "pera": "🍐", "plàtan": "🍌", "maduixa": "🍓", "pa": "🍞", "formatge": "🧀", "llet": "🥛", "pastanaga": "🥕", "tomàquet": "🍅", "raïm": "🍇", "cirera": "🍒", "síndria": "🍉", "llapis": "✏️", "llibre": "📘", "taula": "🪑", "cadira": "🪑", "motxilla": "🎒", "goma": "🧽", "tisores": "✂️", "pissarra": "🟩", "paper": "📄", "regle": "📏", "mà": "✋", "peu": "🦶", "braç": "💪", "cama": "🦵", "cap": "🙂", "nas": "👃", "boca": "👄", "ull": "👁️", "orella": "👂", "dit": "☝️", "genoll": "🦵", "porta": "🚪", "finestra": "🪟", "llit": "🛏️", "cuina": "🍳", "sofà": "🛋️", "mirall": "🪞", "dutxa": "🚿", "armari": "🚪", "llum": "💡", "rellotge": "🕒", "arbre": "🌳", "flor": "🌼", "muntanya": "⛰️", "riu": "🏞️", "mar": "🌊", "sol": "☀️", "lluna": "🌙", "núvol": "☁️", "pluja": "🌧️", "vent": "💨", "pedra": "🪨", "fulla": "🍃", "vaixell": "🚢", "avió": "✈️", "biblioteca": "📚", "sabata": "👟", "botiga": "🏪", "gelat": "🍦", "jardí": "🌷", "joguina": "🧸", "jaqueta": "🧥", "guitarra": "🎸", "guineu": "🦊", "aigua": "💧", "guant": "🧤", "casa": "🏠", "cotxe": "🚗", "escola": "🏫", "paquet": "📦", "mosquit": "🦟", "cullera": "🥄", "raqueta": "🏸", "plaça": "🏙️", "sopa": "🥣", "caixa": "📦", "xocolata": "🍫", "bruixa": "🧙", "panxa": "🤰", "llimona": "🍋", "pinya": "🍍", "aranya": "🕷️", "banyera": "🛁", "castanya": "🌰", "carro": "🛒", "rosa": "🌹", "arròs": "🍚", "barret": "🎩", "camp": "🌾", "tambor": "🥁", "música": "🎵", "camió": "🚚", "cafè": "☕", "màquina": "⚙️", "telèfon": "☎️", "àvia": "👵", "home": "👨", "hospital": "🏥", "herba": "🌿", "hivern": "❄️", "helicòpter": "🚁"};function rand(a){return [...a].sort(()=>Math.random()-.5)}function speak(s){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ca-ES';u.rate=.82;speechSynthesis.speak(u)}}function good(){try{let a=new (window.AudioContext||window.webkitAudioContext)();[660,880,1100].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);let t=a.currentTime+i*.1;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.1);o.start(t);o.stop(t+.11)})}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function options(el,arr){el.innerHTML=arr.map(x=>'<option>'+esc(x)+'</option>').join('')}function norm(s){return s.trim().normalize('NFC').toLocaleLowerCase('ca')}let words=[],idx=0,ok=0,miss=[],revealed=false;options(document.querySelector('#cat'),Object.keys(DATA));function start(){let c=cat.value;words=rand(DATA[c]);if(mode.value==='imatges'){words=words.filter(w=>IMG[w]);if(!words.length){feedback.textContent='Aquesta categoria encara no té imatges. Tria una altra.';return}}idx=0;ok=0;miss=[];render()}function restart(){start()}function difficult(w){let c=cat.value;let patterns={'B / V':/[bv]/gi,'G / J':/[gj]/gi,'G / GU':/gu|g|j/gi,'C / QU':/qu|c/gi,'Ç / C / S':/[çcs]/gi,'X / IX / TX':/tx|ix|x/gi,'LL / L·L':/l·l|ll/gi,'NY':/ny/gi,'R / RR':/rr|r/gi,'M / N':/[mn]/gi,'Accents':/[àèéíòóú]/gi,'Diàresi':/[ïü]/gi,'H':/h/gi};return patterns[c]||/[aeiouàèéíòóú]/gi}function mark(w){let re=difficult(w);return esc(w).replace(re,m=>'<span style="color:#be4761;text-decoration:underline">'+m+'</span>')}function blank(w){let re=difficult(w);return esc(w).replace(re,'_')}function render(){let w=words[idx];progress.textContent=w?'Paraula '+(idx+1)+' de '+words.length:'Sessió completada';score.textContent='Encerts: '+ok+' · Per repassar: '+miss.length;feedback.textContent='';actions.innerHTML='';if(!w){exercise.innerHTML='<div class="big">✓</div><h2>Has acabat!</h2><p>Encerts: '+ok+' de '+words.length+'</p>'+(miss.length?'<p>Paraules per repassar: '+miss.map(esc).join(', ')+'</p>':'');actions.innerHTML='<button onclick="review()">Repassar les difícils</button><button onclick="start()">Nova sessió</button>';return}let m=mode.value;revealed=false;if(m==='visual'){exercise.innerHTML='<p class="muted">Mira la paraula i recorda la part destacada.</p><div class="word">'+mark(w)+'</div>';actions.innerHTML='<button onclick="speak(words[idx])">Escoltar</button><button class="primary" onclick="cover()">Ja la recordo · Tapar</button>'}else if(m==='completa'){exercise.innerHTML='<p class="muted">Quina grafia falta?</p><div class="word">'+blank(w)+'</div><p><input id="answer" autocomplete="off" placeholder="Escriu la paraula completa" aria-label="Escriu la paraula completa"></p>';actions.innerHTML='<button onclick="speak(words[idx])">Escoltar</button><button class="primary" onclick="check()">Comprovar</button>';document.querySelector('#answer').focus()}else if(m==='escric'){exercise.innerHTML='<p class="muted">Escolta la paraula i escriu-la sense mirar.</p><p><button onclick="speak(words[idx])">▶ Escoltar la paraula</button></p><input id="answer" autocomplete="off" placeholder="Escriu aquí" aria-label="Escriu la paraula">';actions.innerHTML='<button class="primary" onclick="check()">Comprovar</button>';speak(w)}else{exercise.innerHTML='<div class="emoji">'+IMG[w]+'</div><p class="muted">Quina paraula representa la imatge?</p><input id="answer" autocomplete="off" placeholder="Escriu la paraula" aria-label="Escriu la paraula">';actions.innerHTML='<button onclick="speak(words[idx])">Escoltar</button><button class="primary" onclick="check()">Comprovar</button>'}}function cover(){exercise.innerHTML='<p class="muted">Ara escriu-la de memòria</p><input id="answer" autocomplete="off" placeholder="Escriu la paraula" aria-label="Escriu la paraula">';actions.innerHTML='<button onclick="speak(words[idx])">Escoltar</button><button class="primary" onclick="check()">Comprovar</button>';document.querySelector('#answer').focus()}function check(){let a=document.querySelector('#answer');if(!a)return;let w=words[idx],right=norm(a.value)===norm(w);if(right){ok++;good();feedback.innerHTML='<span class="success">Molt bé! ✓</span>'}else{miss.push(w);feedback.innerHTML='<span class="error">Revisa la grafia.</span> La forma correcta és: <b>'+mark(w)+'</b>'}actions.innerHTML='<button onclick="speak(words[idx])">Escoltar</button><button class="primary" onclick="next()">Següent →</button>';a.disabled=true}function next(){idx++;render()}function review(){if(!miss.length){start();return}words=rand([...new Set(miss)]);idx=0;ok=0;miss=[];render()}start();</script></body></html>
